name: Fundtiere aktualisieren (Test, wöchentlich)

on:
  schedule:
    - cron: "17 7 * * 1"   # jeden Montag ca. 9:17 Uhr Wiener Zeit
  workflow_dispatch:        # Knopf "Run workflow" zum manuellen Starten

permissions:
  contents: write

concurrency:
  group: fundtiere-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fundtiere und Fotos von der Stadt Wien holen
        run: python scripts/update.py
        timeout-minutes: 8

      - name: Neue Daten speichern
        run: |
          git config user.name "fundtiere-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p photos
          git add data.json photos
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Fundtiere aktualisiert (wöchentlich)"
            git pull --rebase -X theirs origin main
            git push
          fi
